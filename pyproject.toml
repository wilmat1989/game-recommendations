[project]
name = "game-recommendations"
version = "0.1.0"
description = "Recommend the next Steam game a player is likely to enjoy"
readme = "README.md"
authors = [{ name = "Wilson Matos" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.140.9",
    "pyarrow>=25.0.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
